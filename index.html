<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorresGPT</title>
</head>
<body>
    <image href="./image.png"></image>
    <h1>TorresGPT</h1>
    <p id="message">Hello, I am TorresGPT, your helpful substitute 'teacher' that is subbing in! Ask me a question!</p>
    <textarea id="textarea"></textarea><br>
    <button id="button" onclick="answer()">Submit</button>
    <script>
    function answer() {
        const message = document.getElementById('message');
        const textarea = document.getElementById('textarea');
        const button = document.getElementById('button');
        if (textarea.value) {
            console.log(textarea.value);
            if (textarea.value.toLowerCase().includes("mrs. torres")) {
                message.innerHTML = "Let Mrs. Torres look after her son in peace and do your work!";
            } else if (textarea.value.toLowerCase().includes("cheat")) {
                message.innerHTML = "I <strong>KNEW</strong> that you were going to cheat! Now, you are getting a <strong>REFERRAL!</strong>";
                textarea.style.display = 'none';
                button.style.display = 'none';
            } else if (textarea.value.includes("1+1") || textarea.value.includes("1 + 1")) {
                message.innerHTML = "The answer is 2. Do you think I'm a <strong>FRAUD</strong>?!";
            } else if (textarea.value.includes("you be back")) {
                message.innerHTML = "I bet you're asking me to see when you can play games. Well guess what. I'm coming back now.";
            } else if (textarea.value.includes("vocab")) {
                message.innerHTML = "Need help with the vocab words? Fine. Here they are.<br><strong>Integrity</strong>: The quality of being honest and having a firm, uncompromising adherence to strong moral and ethical principles.<br><strong>Animosity</strong>: A powerful, active feeling of deep-seated dislike, ill will, or hostility that often drives people or groups into open opposition. <br><strong>Magnanimity</strong>: The quality of being noble, kind, and generously forgiving, especially toward a rival, an enemy, or someone you have defeated or who has mistreated you.<br><strong>Frivality</strong>: A lack of seriousness, or an act, behavior, or item that is silly, lighthearted, and unimportant.<br><strong>Disparity</strong>: A noticeable, often unfair diffrence or inequality between people, groups, or things.<br><strong>Alacrity</strong>: A cheerful, eager readiness or prompt willingness to do something.<br><strong>Ambiguity</strong>: The state of a word, phrase, sentence, or situation having more than one possible meaning or interpretation.<br><strong>Equity</strong>: Ownership value or fairness.<br><strong>Sovereignty</strong>: The supreme power and independent authority of a self-governing state or entity to govern itself.<br><strong>Civility</strong>: Formal politeness, courtesy, and respectful behavior."
            }
            else if (["who", "what", "when", "why", "where", "how"]
            .some(word => textarea.value.toLowerCase().includes(word))) { 
                message.innerHTML = `I don't know, Google might tell you. <a href="https://www.google.com/search?q=${textarea.value}">Google link because I'm kind.</a>`;
            } else {
                message.innerHTML = 'How did you manage to write a question without "who", "what", "when", "why", "where", or "how"?'
            }
        } else {
            message.innerHTML = "Please type your question below.";
        }
    }
</script>
</body>
</html>
